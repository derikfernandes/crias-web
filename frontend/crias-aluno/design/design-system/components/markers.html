<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crias · Trilha</title>
<link rel="stylesheet" href="../styles.css" />
<style>.demo { max-width: 320px; margin: 0 auto; padding: 24px 16px; background: var(--color-highlight-1); } .row { display:flex; align-items:center; gap:10px; padding:7px 10px; font-size:13px; }</style>
</head>
<body>
<main class="demo">
  <div style="display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px">Matemática básica
    <svg class="seta-trilha" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
  <div class="progresso" style="margin:8px 0"><span style="width:30%"></span></div>
  <div class="text-muted" style="font-size:12px;margin-bottom:8px">Atividade 2 de 5</div>
  <div class="row"><span class="passo-num feito">✓</span>Porcentagem</div>
  <div class="row" style="background:var(--color-highlight-2);border-radius:10px;font-weight:700"><span class="passo-num atual">2</span>Frações equivalentes</div>
  <div class="row" style="opacity:.5"><span class="passo-num">3</span>Proporção</div>
  <p class="text-muted" style="font-size:12px;margin-top:12px">Seta para a direita: fechada. Para baixo: aberta. Atividades futuras ficam desativadas.</p>
</main>
</body>
</html>
