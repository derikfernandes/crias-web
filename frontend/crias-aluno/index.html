<!doctype html>
<html lang="pt-BR" data-v2="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Crias</title>
    <link rel="icon" type="image/svg+xml" href="/crias-simbolo-luz.svg" />
    <link rel="apple-touch-icon" href="/crias-symbol.png" />
    <link rel="preload" as="image" href="/crias-symbol-192.png" />
    <link rel="preload" as="image" href="/crias-logo-site.svg" />
    <link rel="preload" as="image" href="/crias-logo-site-branco.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&family=Barlow:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Tema claro é o padrão. Escuro só pela escolha do aluno (chave crias-aluno-v2-tema). */
      try {
        var escuro = localStorage.getItem('crias-aluno-v2-tema') === 'escuro'
        document.documentElement.dataset.v2 = escuro ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', escuro ? '#000000' : '#ffffff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
